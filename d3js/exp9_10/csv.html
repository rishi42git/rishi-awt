<!DOCTYPE html>
<html>
<head>
<title>Experiment 10: CSV Graph</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #fafafa;
    padding: 30px;
    max-width: 900px;
    margin: auto;
  }

  h1 {
    font-weight: 600;
    color: #222;
    margin-bottom: 20px;
  }

  svg {
    border: 1px solid #ccc;
    background: white;
    border-radius: 8px;
  }
</style>
</head>

<body>

<h1>Experiment 10: CSV → Graph using D3.js</h1>

<svg width="600" height="350"></svg>

<script>
const svg = d3.select("svg");
const width = 600;
const height = 350;
const barWidth = 60;

d3.csv("data.csv").then(data => {

  data.forEach(d => d.value = +d.value);

  svg.selectAll("rect")
    .data(data)
    .enter()
    .append("rect")
      .attr("x", (d, i) => i * (barWidth + 15))
      .attr("y", d => height - d.value * 5)
      .attr("width", barWidth)
      .attr("height", d => d.value * 5)
      .attr("fill", "#4e79a7");

  svg.selectAll("text")
    .data(data)
    .enter()
    .append("text")
      .text(d => d.name)
      .attr("x", (d, i) => i * (barWidth + 15) + 20)
      .attr("y", height - 8)
      .attr("fill", "#333")
      .style("font-size", "12px");
});
</script>

</body>
</html>
